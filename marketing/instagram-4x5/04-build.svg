itable 392-object concept scene.</text><rect x="90" y="766" width="900" height="146" rx="12" fill="#193329" stroke="#476457"/><text x="124" y="820" fill="#eca774" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" >03</text><text x="184" y="820" fill="#f4f1e7" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" >Geometry checks</text><text x="184" y="860" fill="#b5c7bd" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" >Reject moved checkout or blocked 1.5 m routes.</text><rect x="90" y="929" width="900" height="146" rx="12" fill="#193329" stroke="#476457"/><text x="124" y="983" fill="#eca774" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" >04</text><text x="184" y="983" fill="#f4f1e7" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" >Interactive Three.js viewer</text><text x="184" y="1023" fill="#b5c7bd" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" >Walk through both layouts. Export JSON + GLB.</text><text x="90" y="1130" fill="#b5c7bd" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" >The included demo needs no keys.</text><text x="90" y="1163" fill="#b5c7bd" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" >Optional live planning uses your API account.</text><path d="M90 1210h900" stroke="#476457"/><text x="90" y="1255" fill="#b5c7bd" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" letter-spacing="2">AI RETAIL STORE PLANNER</text><text x="990" y="1262" fill="#f4f1e7" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="end">04 / 05</text></svg>